<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطوط الجوية القطرية - جاري التحميل...</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
            background-color: #5C0632;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .loading-container {
            text-align: center;
            padding: 40px;
        }

        .spinner-wrapper {
            margin: 0 auto 25px auto;
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .loading-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
        }

        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-left img {
            height: 55px;
            object-fit: contain;
        }
        .lang-btn {
            font-weight: bold;
            color: #ffffff;
            background: #5C0632;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
        }
        .lang-btn:hover {
            background-color: #3D0420;
        }
        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 16px;
            cursor: pointer;
        }
        .menu-icon span {
            display: block;
            height: 3px;
            background-color: #000000;
            border-radius: 2px;
        }

        /* Footer Styles */
        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .footer-logo {
            height: 50px;
            object-fit: contain;
            margin-bottom: 25px;
            background: transparent;
        }
        .footer-info {
            font-size: 15px;
            line-height: 2.2;
            color: #cccccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .footer-bottom {
            margin-top: 40px;
            width: 100%;
            border-top: 1px solid #3D0420;
            padding-top: 20px;
            font-size: 14px;
            color: #777777;
            text-align: center;
        }
    </style>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="header-left">
            <img src="images/qatar_airways/logo.png" alt="الخطوط الجوية القطرية">
        </div>
        <div class="header-right">
            <a href="loading_en.html" class="lang-btn">English</a>
        </div>
    </header>
<div class="loading-container">
        <div class="spinner-wrapper">
            <div class="spinner"></div>
        </div>
        <div class="loading-title">يتم تأكيد الطلب...</div>
        <p class="loading-text">يرجى الانتظار، يتم معالجة الدفع الخاص بك.</p>
    </div>
    <footer style="background-color: #5C0632; color: #ffffff; padding: 60px 20px 30px 20px; margin-top: 60px;">
        <div class="footer-container">
            <a href="index.html"><img src="images/qatar_airways/logo.png" alt="الخطوط الجوية القطرية" class="footer-logo"></a>
            <div class="footer-info">
                <strong>الخطوط الجوية القطرية (Qatar Airways)</strong>
                <span>الدوحة - دولة قطر</span>
                <span>الهاتف: +974 4403 6666</span>
                <span>البريد الإلكتروني: info@qatarairways.com</span>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 بنك قطر الوطني. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

</body>
</html>
