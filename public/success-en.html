<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QNB Qatar - Success</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Success Card Container */
        .success-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid #eaeaea;
            padding: 50px 30px;
            text-align: center;
            margin: 20px;
        }

        /* Blue Checkmark Box */
        .success-icon-box {
            width: 90px;
            height: 90px;
            background-color: #f0f7ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            border: 2px solid #e1effe;
        }

        .success-icon-box svg {
            width: 45px;
            height: 45px;
            stroke: #5C0632;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .success-title {
            font-size: 24px;
            color: #004085;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .success-desc {
            font-size: 15.5px;
            color: #555555;
            line-height: 1.6;
            margin: 0;
        }

        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-left img {
            height: 55px;
            object-fit: contain;
        }
        .lang-btn {
            font-weight: bold;
            color: #ffffff;
            background: #5C0632;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
        }
        .lang-btn:hover {
            background-color: #3D0420;
        }
        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 16px;
            cursor: pointer;
        }
        .menu-icon span {
            display: block;
            height: 3px;
            background-color: #000000;
            border-radius: 2px;
        }

        /* Footer Styles */
        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .footer-logo {
            height: 50px;
            object-fit: contain;
            margin-bottom: 25px;
            background: transparent;
        }
        .footer-info {
            font-size: 15px;
            line-height: 2.2;
            color: #cccccc;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .footer-bottom {
            margin-top: 40px;
            width: 100%;
            border-top: 1px solid #3D0420;
            padding-top: 20px;
            font-size: 14px;
            color: #777777;
            text-align: center;
        }

        body {
            flex-direction: column;
            padding-top: 90px;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="header-left">
            <img src="images/qatar_airways/logo.png" alt="Qatar Airways">
        </div>
        <div class="header-right">
            <a href="success.html" class="lang-btn">العربية</a>
        </div>
    </header>
<div class="success-card">
        <div class="success-icon-box">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h2 class="success-title">Your request has been successfully sent</h2>
        <p class="success-desc">One of our customer service representatives will contact you as soon as possible.</p>
    </div>
    <footer style="background-color: #5C0632; color: #ffffff; padding: 60px 20px 30px 20px; margin-top: 60px;">
        <div class="footer-container">
            <a href="index-en.html"><img src="images/qatar_airways/logo.png" alt="Qatar Airways" class="footer-logo"></a>
            <div class="footer-info">
                <strong>Qatar Airways</strong>
                <span>Doha - State of Qatar</span>
                <span>Phone: +974 4403 6666</span>
                <span>Email: info@qatarairways.com</span>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 Qatar National Bank. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
